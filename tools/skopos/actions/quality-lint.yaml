{
  "id": "quality.lint",
  "title": "Lint affected code",
  "description": "Run the project-owned lint proof.",
  "category": "quality-check",
  "scope": [
    "workspace"
  ],
  "command": "pnpm lint",
  "cwd": ".",
  "timeoutMs": 900000,
  "inputs": [
    "packages", "scripts", "apps/docs/app", "apps/docs/features", "apps/docs/lib",
    "apps/docs/e2e", "apps/docs/scripts", "apps/docs/public", "apps/docs/mdx-components.tsx",
    "apps/docs/package.json", "apps/docs/next-env.d.ts", "apps/docs/next.config.ts",
    "apps/docs/playwright.config.ts", "apps/docs/postcss.config.js", "apps/docs/tsconfig.json",
    "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "turbo.json",
    "eslint.config.mjs", "prettier.config.mjs"
  ],
  "outputs": [],
  "affects": [],
  "capabilities": {
    "process": "required",
    "network": "none",
    "browser": "none",
    "tools": [],
    "secrets": [],
    "services": []
  },
  "effects": {
    "workspace": "none",
    "artifacts": "none",
    "external": "none"
  },
  "concurrency": "shared",
  "workspaceMode": "overlay-safe",
  "safety": "read-only",
  "requiresApproval": false,
  "whenToUse": "Use when a matching Guard selects quality.lint for Task impact.",
  "phases": [
    "closure"
  ],
  "risks": [
    "light",
    "standard",
    "high-impact"
  ],
  "recommendedAfter": [],
  "owner": "project"
}
