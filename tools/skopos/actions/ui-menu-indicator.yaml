id: ui.menu-indicator
title: Verify menu selection indicator and registry parity
description: Prove independent selection/content-icon slots and validate generated registry ownership.
category: quality-check
scope: [workspace]
command: pnpm --filter @unisane/ui exec vitest run --config vitest.config.ts tests/dropdown-menu
cwd: .
timeoutMs: 120000
inputs: [packages/ui/src, packages/ui/tests/dropdown-menu, packages/ui/vitest.config.ts, packages/ui/package.json, pnpm-lock.yaml]
outputs: []
affects: []
capabilities: {process: required, network: none, browser: none, tools: [pnpm], secrets: [], services: []}
effects: {workspace: none, artifacts: none, external: none}
concurrency: shared
workspaceMode: overlay-safe
safety: read-only
requiresApproval: false
phases: [iteration, stabilization, closure]
risks: [standard, high-impact]
owner: ui-maintainers
