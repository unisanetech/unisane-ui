id: ui.modal-overlays
title: Verify nested modal picker behavior
description: Prove accessible portal ancestry, selection, focus isolation and dismissal in shared modal controls.
category: quality-check
scope: [workspace]
command: pnpm --filter @unisane/ui exec vitest run --config vitest.config.ts tests/combobox tests/select tests/popover tests/dropdown-menu tests/dialog tests/sheet
cwd: .
timeoutMs: 180000
inputs: [packages/ui/src, packages/ui/tests, packages/ui/vitest.config.ts, packages/ui/package.json, pnpm-lock.yaml]
outputs: []
affects: []
capabilities: {process: required, network: none, browser: none, tools: [pnpm], secrets: [], services: []}
effects: {workspace: none, artifacts: none, external: none}
concurrency: shared
workspaceMode: overlay-safe
safety: read-only
requiresApproval: false
phases: [iteration, stabilization, closure]
risks: [standard, high-impact]
owner: ui-maintainers
