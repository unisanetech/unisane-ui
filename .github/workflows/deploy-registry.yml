name: Deploy UI registry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-registry.yml
      - packages/ui/registry/**
      - packages/ui/src/**
      - packages/ui/package.json
      - packages/ui-cli/components.schema.json
      - scripts/build-static-registry.mjs
      - scripts/check-static-registry.mjs
      - scripts/__tests__/build-static-registry.test.mjs
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ui-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:static-registry
      - run: pnpm check:shadcn-registry
      - run: pnpm build:registry-site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload registry site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .tmp/registry-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Deploy registry site
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed registry contract
        run: node scripts/check-static-registry.mjs --remote "${{ steps.deployment.outputs.page_url }}"
